# Карта гипотез как код (методология: картагипотез.рф / Byndyusoft)
#
# Это единственный источник правды. Редактируйте этот файл (самостоятельно или через LLM),
# затем запускайте:  uv run --with pyyaml generate.py
# Артефакты map.md и map.html генерируются автоматически — править их руками не нужно.
#
# Статусы гипотез: draft | to-verify | confirmed | refuted
# Влияние/затраты:  low | medium | high

meta:
  title: "Демо: «Смены.Про» — стратегия роста выручки"
  horizon: до конца 2027 года
  version: 1
  date: 2026-11-15

goal:
  id: goal-mrr
  description: Удвоить выручку от новых клиентов за 12 месяцев
  metrics:
    - id: metric-conversion
      description: Конверсия триал → платный
      current: 8%
      target: 15%
      balancing: false
    - id: metric-churn
      description: Отток клиентов в первые 3 месяца
      current: 12%
      target: 5%
      balancing: true          # балансирующая: не гнём конверсию ценой качества

subjects:
  - id: subject-shift-lead
    description: Руководитель смены на производстве (50–500 сотрудников)
    influence: high            # сила влияния на цель
    pains:
      - Планирует смены вручную в Excel — 6+ часов в неделю
      - Текучка персонала постоянно ломает график
    wishes:
      - Расписание, которое «просто работает» и правится за минуты

  - id: subject-hr
    description: HR-директор — негативный субъект, тормозит сделку на проверке ИБ
    influence: medium
    pains:
      - Боится утечки персональных данных при переходе в облако
      - Опасается, что софт «выкинет» людей из процесса планирования
    wishes: []

hypotheses:
  - id: hyp-live-demo
    subject: subject-shift-lead
    metrics: [metric-conversion]
    influence: high
    cost: low
    status: to-verify
    if: показать автопланирование смены за 30 секунд на данных клиента в первые минуты демо
    then: конверсия триал → платный вырастет с 8% до 12%
    because: главная боль субъекта — часы ручного планирования, и решение о покупке принимается в первые 10 минут демо
    so: встроить интерактивный сценарий «загрузи Excel — получи расписание» в онбординг-демо

  - id: hyp-sandbox
    subject: subject-shift-lead
    metrics: [metric-conversion, metric-churn]
    influence: high
    cost: medium
    status: draft
    if: дать триалу режим «песочницы» с демо-данными и быстрой кнопкой сброса
    then: доля триалов, дошедших до первого расписания, вырастет с 40% до 60%
    because: страх испортить реальные данные персонала останавливает исследование продукта
    so: добавить пустой проект с генератором фейковых смен и подсказками первых шагов

  - id: hyp-onprem
    subject: subject-hr
    metrics: [metric-conversion]
    influence: medium
    cost: low
    status: to-verify
    if: вынести на сайт страницу «Безопасность и on-premise» с типовым DPA до старта триала
    then: доля сделок, зависающих на проверке ИБ, снизится с 35% до 20%
    because: HR снимает возражение ещё до того, как оно попадает в закупку
    so: подготовить страницу, DPA-шаблон и FAQ для отдела ИБ

tasks:
  - id: task-demo-script
    hypothesis: hyp-live-demo
    description: Сценарий демо «Excel → расписание за 30 секунд»
    owner: Аня (продукт)
    due: 2026-12-01

  - id: task-demo-funnel
    hypothesis: hyp-live-demo
    description: Разметить воронку демо в аналитике
    owner: Костя (аналитика)
    due: 2026-12-05

  - id: task-sandbox-mvp
    hypothesis: hyp-sandbox
    description: MVP песочницы с генератором демо-смен
    owner: Игорь (разработка)
    due: 2026-12-15

  - id: task-sandbox-dashboard
    hypothesis: hyp-sandbox
    description: Дашборд активации триала (до первого расписания)
    owner: Костя (аналитика)
    due: 2026-12-10

  - id: task-onprem-page
    hypothesis: hyp-onprem
    description: Страница «Безопасность и on-premise» на сайте
    owner: Аня (продукт)
    due: 2026-11-28

  - id: task-onprem-dpa
    hypothesis: hyp-onprem
    description: Типовой DPA и FAQ для отдела ИБ
    owner: Марина (юрист)
    due: 2026-12-10

blockers:
  - id: blocker-analytics
    blocks: task-demo-funnel
    reason: Нет доступа к сырым данным воронки триалов в BI
    action: Запросить выгрузку у инфраструктуры
    owner: Костя (аналитика)
    due: 2026-11-25
