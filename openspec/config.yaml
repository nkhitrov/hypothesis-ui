schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: веб-приложение «Карта гипотез» (Vite + React + TypeScript, статика без CDN в рантайме).
  Методология: картагипотез.рф / Byndyusoft hypothesismapping (цель+метрики, субъекты с болями/желаниями,
  гипотезы «Если—то—потому что—тогда», задачи, блокеры; негативный субъект; балансирующие метрики;
  влияние/затраты low|medium|high; статусы гипотез draft|to-verify|confirmed|refuted).
  Данные: JSON-модель карты — единственный источник правды; хранение в localStorage браузера;
  импорт/экспорт JSON и YAML; правки через LLM — через экспорт/импорт и встроенный текстовый редактор модели.
  Схема унаследована от прежнего map.yaml (python-пайплайн удалён, см. git-историю).
  UI на русском. Стиль карточного вида — специализированные сервисы (Гипотезная/Социотех), не UML-диаграммы.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
