schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: веб-приложение «Карта гипотез» (Vite + React + TypeScript, статика без CDN в рантайме).
  Методология: стандарт 1.2 Карты гипотез; источник истины — вендоренная база знаний
  docs/knowledge-base (Byndyusoft/hypothesismapping + скилл sociotech-ai-skills/hypothesis-mapping).
  Топология: Задача → Гипотеза → Субъект → Цель (допустим бессубъектный контур Задача → Гипотеза → Цель);
  боли/желания и метрики — отдельными карточками (мотивация → субъект, метрика → цель);
  связь задача→цель запрещена (многоуровневая карта = отдельная дочерняя карта + task.childMapId).
  Цвета и приоритеты («относительно соседа слева») — канонические, из стандарта 1.2.
  Данные: JSON-модель карты — единственный источник правды; хранение в localStorage браузера;
  импорт/экспорт JSON и YAML; правки через LLM — через экспорт/импорт и встроенный текстовый редактор модели.
  UI на русском. Стиль — специализированные сервисы (Гипотезная/Социотех), не UML-диаграммы;
  доска строго горизонтальная: стрелки только справа налево, вход в правую грань карточки.

